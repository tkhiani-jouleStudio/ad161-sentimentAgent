id: 04_Correctness_LowConfidenceAmbiguous
description: >
  Failure path — ambiguous input with mixed signals. Verifies the agent returns a
  best-effort label and surfaces a low confidence score when the input is unclear.
tags:
  - correctness
test_steps:
  - type: dynamic_conversation
    user_agent:
      task_summary: |
        You are a CX analyst. You want to classify a piece of ambiguous feedback.
        Submit the following feedback text for classification:
        "It was okay. Some things worked, some did not. I have used better products
        but also much worse ones."
        You know the full text above. You expect the agent to return a label
        and a confidence score. If the agent asks for more information, say you
        have no additional context.
      initial_message: >
        Classify this feedback: "It was okay. Some things worked, some did not.
        I have used better products but also much worse ones."
    max_turns: 3
    agent_response_validations:
      - check: 'The agent returns one of the three allowed sentiment labels — positive, negative, or neutral — even though the feedback is ambiguous.'
      - check: 'The agent includes a confidence score in its response and that score reflects uncertainty about the classification.'
      - check: 'The agent includes a reasoning statement that references specific content from the ambiguous feedback text.'
    rule_compliance_validations:
      - check: 'The agent does not refuse to classify the input on the grounds that it is ambiguous; it returns a best-effort label with an appropriate confidence score.'
    tool_validations:
      expected_tool_calls:
        - tool: classify_sentiment
          parameters:
            feedback_text:
              check: >
                The parameter contains the full ambiguous feedback text about things
                working and not working, and comparisons to better and worse products.
          output:
            check: >
              The tool returns a JSON object with a sentiment label (positive, negative,
              or neutral), a confidence value that is below 0.6 or otherwise reflects
              low certainty, and a reasoning string referencing the mixed signals.
